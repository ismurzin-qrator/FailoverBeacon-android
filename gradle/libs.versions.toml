[versions]
agp = "9.0.1"
animalsniffer = "2.0.1"
junit = "4.13.2"
kotlin = "2.3.21"
kotlin-stdlib = "2.1.21"
ktlint = "1.8.0"
okhttp-latest = "5.5.0"
okhttp-minimum = "3.14.9"
okhttp-4 = "4.12.0"
okhttp-5-2 = "5.2.3"
okhttp-5-3 = "5.3.2"
okhttp-5-4 = "5.4.0"
okhttp-5-5 = "5.5.0"
robolectric = "4.17"
spotless = "8.10.3"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
squareup-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp-latest" }
squareup-okhttp-minimum = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp-minimum" }
squareup-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp-latest" }
squareup-okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp-latest" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-stdlib" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
animalsniffer-gradle-plugin = { module = "ru.vyarus:gradle-animalsniffer-plugin", version.ref = "animalsniffer" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
